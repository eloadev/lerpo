<!doctype html>
<html lang="es">
<head>

  <meta name="referrer" content="strict-origin-when-cross-origin">

    img-src 'self' https: data: blob:;
    connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net;
    base-uri 'self'; form-action 'self'; object-src 'none';">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon/favicon-64.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">

  <meta name="theme-color" content="#0F1B28" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

</html>
